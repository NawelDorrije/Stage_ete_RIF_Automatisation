[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
roles_path = roles
result_format = yaml
# Réseau du fournisseur instable : tente de nouvelles connexions.
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=30
retries = 5
