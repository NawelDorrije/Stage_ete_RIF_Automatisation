---
# Sites multi-vhost — un VirtualHost Nginx par entrée, chaque sous-domaine
# servant une application indépendante.
reverse_proxy_sites:
  - name: rif-fullstack
    domain: rif-fullstack.duckdns.org
    upstream_host: 192.168.100.87
    upstream_port: 80
  - name: rif-javajs
    domain: rif-javajs.duckdns.org
    upstream_host: 192.168.100.149
    upstream_port: 80
  - name: rif-openedx
    domain: rif-openedx.duckdns.org
    upstream_host: 192.168.100.55
    upstream_port: 80
  # MFE (authn/learning) — hôte dédié requis par le reverse proxy interne de
  # Tutor (Caddy route par Host, pas par chemin). Le sous-domaine DuckDNS
  # apps.rif-openedx (déjà en place, pointe sur 188.40.148.152) est géré hors de
  # ce token : le cron DuckDNS tolère son échec (script par domaine).
  - name: apps.rif-openedx
    domain: apps.rif-openedx.duckdns.org
    upstream_host: 192.168.100.55
    upstream_port: 80
  # Odoo — instance applicative sur 192.168.100.91.
  # Port 8090 corresponds to the odoo_waf container (WAF-protected entry).
  - name: rif-odoo
    domain: rif-odoo.duckdns.org
    upstream_host: 192.168.100.91
    upstream_port: 8090
  # rif-openedx-studio (CMS/Studio) re-added when DuckDNS subdomain is created:
  # - name: rif-openedx-studio
  #   domain: rif-openedx-studio.duckdns.org
  #   upstream_host: 192.168.100.55
  #   upstream_port: 80

# Nginx (valeurs partagées)
reverse_proxy_client_max_body_size: 20m
reverse_proxy_read_timeout: 300
reverse_proxy_connect_timeout: 30
reverse_proxy_send_timeout: 300
# Pare-feu — 0.0.0.0/0 aligné sur la règle SSH actuelle du Security Group
# OpenStack (vérifiée le 2026-08-03). Resserrer en /32 des deux côtés si besoin.
reverse_proxy_manage_ufw: true
reverse_proxy_ssh_port: 22
reverse_proxy_admin_cidrs:
  - 0.0.0.0/0   # Aligné sur le SG OpenStack. Remplacer par votre IP publique /32.
# DuckDNS — automatisé via le rôle (cron toutes les 5 min). Tous les
# sous-domaines de reverse_proxy_sites sont mis à jour vers l'IP publique
# entrante du bastion 188.40.148.152. L'egress du bastion étant 195.201.169.165
# (FIP en DNAT-only), duckdns_ip est figé explicitement.
# Le token est dans ansible/group_vars/all/vault.yml (gitignoré, ne jamais communiter).
reverse_proxy_manage_duckdns: true
duckdns_ip: 188.40.148.152
duckdns_update_interval_minutes: 5
# HTTPS — certificats Let's Encrypt émis par domaine via webroot (un par site).
reverse_proxy_enable_https: true
certbot_email: larrymclarens@gmail.com
certbot_redirect_http_to_https: true
# Tests — DNS résolu : tests publics activés.
reverse_proxy_validate_upstream: true
reverse_proxy_validate_public_http: true
reverse_proxy_validate_public_https: true