---
# Domaine public
reverse_proxy_domain: rif-javajs.duckdns.org

# Upstream privé — VM Java-JS (DakarCitoyen frontend, vérifié le 2026-08-03 :
# le port 80 sert le frontend "Shadcn Admin" et proxyfie aussi /auth vers le backend)
reverse_proxy_upstream_host: 192.168.100.149
reverse_proxy_upstream_port: 80

# Nginx
reverse_proxy_site_name: rif-javajs
reverse_proxy_client_max_body_size: 20m
reverse_proxy_read_timeout: 300
reverse_proxy_connect_timeout: 30
reverse_proxy_send_timeout: 300

# Pare-feu — 0.0.0.0/0 aligné sur la règle SSH actuelle du Security Group
# OpenStack (vérifiée le 2026-08-03). Resserrer en /32 des deux côtés si besoin.
reverse_proxy_manage_ufw: true
reverse_proxy_ssh_port: 22
reverse_proxy_admin_cidrs:
  - 0.0.0.0/0   # Aligné sur le SG OpenStack. Remplacer par votre IP publique /32.

# DuckDNS — automatisé via le rôle (cron toutes les 5 min, enregistrement ->
# IP publique entrante du bastion 188.40.148.152). L'egress du bastion étant
# 195.201.169.165 (FIP en DNAT-only), duckdns_ip est figé explicitement.
# Le token est dans ansible/group_vars/all/vault.yml (gitignoré, ne jamais committer).
reverse_proxy_manage_duckdns: true
duckdns_subdomain: rif-javajs
duckdns_ip: 188.40.148.152
duckdns_update_interval_minutes: 5

# HTTPS — passe 2 (2026-08-03) : DNS OK, certbot --nginx émet le certificat
# Let's Encrypt et réécrit le vhost en 443 + redirection HTTP.
reverse_proxy_enable_https: true
certbot_email: larrymclarens@gmail.com
certbot_redirect_http_to_https: true

# Tests — DNS résolu : tests publics activés.
reverse_proxy_validate_upstream: true
reverse_proxy_validate_public_http: true
reverse_proxy_validate_public_https: true
