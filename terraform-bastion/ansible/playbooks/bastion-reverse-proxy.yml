---
- name: Transformer le Bastion en Reverse Proxy Nginx (Fullstack / DakarCitoyen)
  hosts: bastion
  become: true
  gather_facts: true

  pre_tasks:
    - name: Vérifier la distribution cible
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
        fail_msg: "Ce playbook est prévu pour Ubuntu/Debian."

    - name: Vérifier l'accès aux applications privées
      ansible.builtin.uri:
        url: "http://{{ item.upstream_host }}:{{ item.upstream_port }}"
        method: HEAD
        headers:
          Host: "{{ item.domain }}"
        # 2xx/3xx = upstream vivant (une redirection http->https ou vers le login
        # est saine). follow_redirects=none : on teste l'upstream, pas la chaîne.
        status_code: [200, 301, 302, 308]
        follow_redirects: none
        timeout: 10
      loop: "{{ reverse_proxy_sites }}"
      changed_when: false

  roles:
    - role: reverse_proxy
