---
- name: Désactiver le Reverse Proxy du Bastion
  hosts: bastion
  become: true

  tasks:
    - name: Supprimer les liens des sites actifs
      ansible.builtin.file:
        path: "/etc/nginx/sites-enabled/{{ item.name }}"
        state: absent
      loop: "{{ reverse_proxy_sites }}"
      notify:
        - Tester la syntaxe Nginx
        - Recharger Nginx

  handlers:
    - name: Tester la syntaxe Nginx
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Recharger Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
