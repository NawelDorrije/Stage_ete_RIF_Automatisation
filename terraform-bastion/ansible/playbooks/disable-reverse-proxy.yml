---
- name: Désactiver le Reverse Proxy du Bastion
  hosts: bastion
  become: true

  tasks:
    - name: Supprimer le lien du site actif
      ansible.builtin.file:
        path: "/etc/nginx/sites-enabled/{{ reverse_proxy_site_name | default('rif-javajs') }}"
        state: absent
      notify:
        - Tester la syntaxe Nginx
        - Recharger Nginx

  handlers:
    - name: Tester la syntaxe Nginx
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Recharger Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
