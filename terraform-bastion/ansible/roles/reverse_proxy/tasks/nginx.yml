---
- name: Mettre à jour le cache APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Installer Nginx et les outils nécessaires
  ansible.builtin.apt:
    name:
      - nginx
      - curl
      - ca-certificates
    state: present
  become: true

- name: Déployer les paramètres de durcissement Nginx
  ansible.builtin.template:
    src: nginx-hardening.conf.j2
    dest: /etc/nginx/conf.d/99-reverse-proxy-hardening.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  notify:
    - Tester la syntaxe Nginx
    - Recharger Nginx

- name: Déployer les VirtualHost Reverse Proxy
  ansible.builtin.template:
    src: reverse-proxy.conf.j2
    dest: "/etc/nginx/sites-available/{{ item.name }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ reverse_proxy_sites }}"
  become: true
  vars:
    # Nom d'upstream nginx sanitized (nom de site DuckDNS, ex. apps.rif-openedx
    # -> apps_rif_openedx) : les points ne sont pas sûrs dans un bloc upstream.
    reverse_proxy_site_name: "{{ item.name | regex_replace('[^A-Za-z0-9_]', '_') }}"
    reverse_proxy_domain: "{{ item.domain }}"
    reverse_proxy_upstream_host: "{{ item.upstream_host }}"
    reverse_proxy_upstream_port: "{{ item.upstream_port }}"
    reverse_proxy_tls_enabled: "{{ reverse_proxy_enable_https | bool and (reverse_proxy_site_tls[item.domain] | default(false)) }}"
  notify:
    - Tester la syntaxe Nginx
    - Recharger Nginx

- name: Activer les VirtualHost
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item.name }}"
    dest: "/etc/nginx/sites-enabled/{{ item.name }}"
    state: link
    force: true
  loop: "{{ reverse_proxy_sites }}"
  become: true
  notify:
    - Tester la syntaxe Nginx
    - Recharger Nginx

- name: Désactiver le site Nginx par défaut
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: true
  notify:
    - Tester la syntaxe Nginx
    - Recharger Nginx

- name: Lister les VirtualHost Nginx activés
  ansible.builtin.find:
    paths: /etc/nginx/sites-enabled
  register: nginx_enabled_sites
  become: true
  changed_when: false
  when: reverse_proxy_cleanup_stale_sites | default(true) | bool

- name: Supprimer les anciens VirtualHost (domaines renommés)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  become: true
  loop: "{{ nginx_enabled_sites.files | default([]) }}"
  when:
    - reverse_proxy_cleanup_stale_sites | default(true) | bool
    - item.path | basename not in (reverse_proxy_sites | map(attribute='name') | list + ['default'])
  notify:
    - Tester la syntaxe Nginx
    - Recharger Nginx

- name: Lister les VirtualHost Nginx disponibles
  ansible.builtin.find:
    paths: /etc/nginx/sites-available
  register: nginx_available_sites
  become: true
  changed_when: false
  when: reverse_proxy_cleanup_stale_sites | default(true) | bool

- name: Supprimer les fichiers des anciens VirtualHost (sites-available)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  become: true
  loop: "{{ nginx_available_sites.files | default([]) }}"
  when:
    - reverse_proxy_cleanup_stale_sites | default(true) | bool
    - item.path | basename not in (reverse_proxy_sites | map(attribute='name') | list + ['default'])
  notify:
    - Tester la syntaxe Nginx
    - Recharger Nginx

- name: S'assurer que Nginx est actif au démarrage
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  become: true
