---
- name: Tester la syntaxe Nginx
  ansible.builtin.command: nginx -t
  changed_when: false
  become: true

- name: Tester les upstreams privés depuis le Bastion
  ansible.builtin.uri:
    url: "http://{{ item.upstream_host }}:{{ item.upstream_port }}"
    method: HEAD
    headers:
      Host: "{{ item.domain }}"
    # 2xx/3xx = upstream vivant (une redirection http->https, vers le login, ou
    # Odoo 303 -> /odoo est saine, ex. MFE Tutor). follow_redirects=none : on
    # teste l'upstream seulement.
    status_code: [200, 301, 302, 303, 308]
    follow_redirects: none
    timeout: 10
  loop: "{{ reverse_proxy_sites }}"
  changed_when: false
  when: reverse_proxy_validate_upstream | bool

- name: Tester les VirtualHost locaux
  ansible.builtin.uri:
    url: http://127.0.0.1/reverse-proxy-health
    headers:
      Host: "{{ item.domain }}"
    return_content: true
    status_code: 200
  loop: "{{ reverse_proxy_sites }}"
  register: local_health
  changed_when: false

- name: Vérifier le contenu du health check
  ansible.builtin.assert:
    that:
      - "'bastion-reverse-proxy-ok' in item.content"
  loop: "{{ local_health.results }}"

- name: Tester les domaines en HTTP
  ansible.builtin.uri:
    url: "http://{{ item.domain }}"
    method: HEAD
    status_code: [200, 301, 302, 303, 308]
    timeout: 15
  loop: "{{ reverse_proxy_sites }}"
  changed_when: false
  when: reverse_proxy_validate_public_http | bool

- name: Tester les domaines en HTTPS
  ansible.builtin.uri:
    url: "https://{{ item.domain }}"
    method: HEAD
    # 2xx/3xx = service servi correctement en HTTPS (redirections saines, ex. MFE
    # ou Odoo 303 -> /odoo)
    status_code: [200, 301, 302, 303, 308]
    timeout: 15
    validate_certs: true
  loop: "{{ reverse_proxy_sites }}"
  changed_when: false
  when:
    - reverse_proxy_enable_https | bool
    - reverse_proxy_validate_public_https | bool
